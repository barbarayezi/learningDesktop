# Cloudflare Worker 部署配置（KV 存储模式）
# 用法：cd cloudflare-sync-proxy && wrangler login && wrangler deploy
# KV namespace 已通过 API 创建：learningdesktop-sync (id 8916d393107b469a9d90625b249e9b4b)
name = "learningdesktop-sync-proxy"
main = "worker.js"
compatibility_date = "2026-01-01"
workers_dev = true

[[kv_namespaces]]
binding = "SYNC_KV"
id = "8916d393107b469a9d90625b249e9b4b"
