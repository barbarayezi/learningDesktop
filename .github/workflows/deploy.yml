name: Deploy to CloudBase Static Hosting
# 2026-08-25 重写：老 action（TencentCloudBase/cloudbase-action@v1, node12）在 node24 runner
# 上登录失败「无有效身份信息」，改用腾讯云官方 CLI（@cloudbase/cli / tcb）的 CI 非交互登录。
# envId 以 `tcb env list` 实测为准：test-d5gf0o9ky7d34beaf（无后缀，后缀数字属于默认域名不属于 envId）。

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '资料/**'
      - 'articles.js'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # index.html 引用的是根目录 articles.js，但仓库里它在 资料/ 下；
      # 复制到根目录，保证公网「资讯」tab 不会 404（也避免覆盖掉手动上传的版本）。
      - name: Ensure root articles.js exists
        run: |
          if [ -f "资料/articles.js" ] && [ ! -f "articles.js" ]; then
            cp "资料/articles.js" articles.js
            echo "Copied 资料/articles.js -> articles.js"
          fi

      # 只部署站点文件。proxy_server.py / cloudbase-sync-proxy / .workbuddy / .git 等
      # 属于后端或私有内容（其中含 CloudBase service_role 密钥），绝不上传公网托管。
      - name: Remove non-site files before upload
        run: |
          rm -rf .git .github .workbuddy proxy_server.py cloudbase-sync-proxy landing-page Find overview.md node_modules 资料/harvest_articles.py cloudbaserc.json 2>/dev/null || true
          echo "Remaining files to deploy:"
          ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      # 提前校验 Secrets，避免 tcb 在缺密钥时给出难懂的报错。
      - name: Pre-check Secrets (TCB_SECRET_ID / TCB_SECRET_KEY)
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: |
          ok=1
          if [ -z "$TCB_SECRET_ID" ]; then echo "❌ TCB_SECRET_ID is missing — 请到仓库 Settings → Secrets → Actions 添加"; ok=0; fi
          if [ -z "$TCB_SECRET_KEY" ]; then echo "❌ TCB_SECRET_KEY is missing — 请到仓库 Settings → Secrets → Actions 添加"; ok=0; fi
          if [ "$ok" -ne 1 ]; then echo "⛔ 部署中止：缺少 CloudBase 凭证"; exit 1; fi
          echo "✅ TCB_SECRET_ID / TCB_SECRET_KEY 均已注入，继续部署"

      - name: Login CloudBase & Deploy to Static Hosting
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          TCB_ENV_ID: test-d5gf0o9ky7d34beaf
        run: |
          set +e
          tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"
          tcb env use "$TCB_ENV_ID"
          tcb hosting deploy . --env-id "$TCB_ENV_ID" --yes 2>&1 | tee /tmp/deploy.log
          rc=${PIPESTATUS[0]}
          cat /tmp/deploy.log
          if [ "$rc" -ne 0 ]; then
            echo "::error::DEPLOY_FAILED rc=$rc"
            grep -iE "DescribeStaticStore|InvalidParameter|fail|denied|AuthFailure|AccessDenied|ResourceNotFound|code|message|RequestId" /tmp/deploy.log | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $rc
          fi
          echo "🎉 部署成功"
